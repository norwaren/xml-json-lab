<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XML and JSON Lab</title>

  <style>
    body {
      max-width: 960px;
      margin: 0 auto;
      padding: 24px;
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #243247;
      background: #f3f6fa;
    }

    h1, h2 {
      color: #173b68;
    }

    section {
      margin-top: 32px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
    }

    .card {
      padding: 20px;
      border: 1px solid #d9e2ed;
      border-radius: 10px;
      background: white;
      overflow-wrap: anywhere;
    }

    .card h3 {
      margin-top: 0;
    }

    .card p {
      margin: 8px 0;
    }

    .status {
      color: #526176;
    }

    .error {
      color: #b42318;
    }
  </style>
</head>

<body>
  <h1>XML and JSON Lab</h1>
  <p>This page displays a book catalogue and user profiles.</p>

  <section>
    <h2>Book Catalogue — XML</h2>
    <p id="books-status" class="status" role="status">Loading books...</p>
    <div id="books" class="grid"></div>
  </section>

  <section>
    <h2>User Profiles — JSON</h2>
    <p id="users-status" class="status" role="status">Loading users...</p>
    <div id="users" class="grid"></div>
  </section>

  <script>
    // Create a labeled line of text inside a card.
    function addField(card, label, value) {
      const paragraph = document.createElement("p");
      const strong = document.createElement("strong");

      strong.textContent = label + ": ";
      paragraph.append(strong, document.createTextNode(String(value)));
      card.appendChild(paragraph);
    }

    function createCard(title) {
      const card = document.createElement("article");
      card.className = "card";

      const heading = document.createElement("h3");
      heading.textContent = title;
      card.appendChild(heading);

      return card;
    }

    function showError(statusId, error) {
      const status = document.getElementById(statusId);
      status.textContent = error.message;
      status.classList.add("error");
      console.error(error);
    }

    // Read and display XML data.
    async function loadBooks() {
      try {
        const response = await fetch("./book.xml");

        if (!response.ok) {
          throw new Error("Fetch error: " + response.status);
        }

        const xmlText = await response.text();

        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(xmlText, "text/xml");

        if (xmlDoc.querySelector("parsererror")) {
          throw new Error("The XML document is not well-formed.");
        }

        const books = xmlDoc.querySelectorAll("book");
        const container = document.getElementById("books");

        books.forEach((book) => {
          const title = book.querySelector("title").textContent;
          const author = book.querySelector("author").textContent;
          const price = book.querySelector("price").textContent;

          const card = createCard(title);
          addField(card, "ID", book.getAttribute("id"));
          addField(card, "Author", author);
          addField(card, "Price", "$" + Number(price).toFixed(2));

          container.appendChild(card);
        });

        document.getElementById("books-status").textContent =
          books.length + " books loaded.";
      } catch (error) {
        showError("books-status", error);
      }
    }

    // Read and display JSON data.
    async function loadUsers() {
      try {
        const response = await fetch("./userProfiles.json");

        if (!response.ok) {
          throw new Error("Fetch error: " + response.status);
        }

        const data = await response.json();
        const container = document.getElementById("users");

        data.users.forEach((user) => {
          const profile = user.profile;
          const preferences = user.preferences;
          const address = profile.address;

          const card = createCard(
            profile.firstName + " " + profile.lastName
          );

          addField(card, "First name", profile.firstName);
          addField(card, "Last name", profile.lastName);
          addField(card, "Email", profile.email);
          addField(card, "Date of birth", profile.dateOfBirth);
          addField(card, "Street", address.street);
          addField(card, "City", address.city);
          addField(card, "State", address.state);
          addField(card, "ZIP code", address.zipCode);
          addField(card, "Theme", preferences.theme);
          addField(card, "Language", preferences.language);
          addField(
            card,
            "Notifications",
            preferences.notifications ? "Enabled" : "Disabled"
          );
          addField(
            card,
            "Newsletter subscription",
            preferences.subscription ? "Yes" : "No"
          );

          container.appendChild(card);
        });

        document.getElementById("users-status").textContent =
          data.users.length + " users loaded.";
      } catch (error) {
        showError("users-status", error);
      }
    }

    loadBooks();
    loadUsers();
  </script>
</body>
</html>
